<style>
  :root{
    --bg:#f6f2e8;
    --panel:#faf7ef;
    --border:#d8d2c0;
    --text:#22303c;
    --muted:#5c6b76;
    --accent:#41607a;
    --accent-dark:#35526b;
    --accent-soft:#41607a17;
    --accent2:#e5be01;
    --accent2-soft:#e5be012a;
    --accent2-dark:#6d5a00;
    --danger:#9c4a3a;
    --danger-soft:#9c4a3a1f;
    --success:#155943;
    --success-soft:#1559431a;
    --sbg:#1c2731;
    --ssurface:#263543;
    --stext:#f6f2e8;
    --smuted:#a9b6bd;
    --sborder:#3d5164;
    --saccent:#7ea0b8;
    --saccent-soft:#7ea0b826;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{font-family:'Space Grotesk', system-ui, sans-serif; color:var(--text); background:var(--bg);}
  h1,h2,h3{font-family:'Unbounded', sans-serif; margin:0; font-weight:600;}
  a{color:var(--accent);} a:hover{color:var(--accent-dark);}
  button{font-family:inherit; cursor:pointer;}
  .mono-label{font-family:'IBM Plex Mono', monospace; text-transform:uppercase; letter-spacing:.12em;}
  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}

  .app-shell{display:flex; width:100%; min-height:100vh; background:var(--bg);}
  .sidebar{width:296px; flex-shrink:0; background:var(--sbg); border-right:1px solid var(--sborder); display:flex; flex-direction:column; padding:28px 22px; gap:24px; color:var(--stext);}
  .main{flex:1; min-width:0; padding:40px 52px 60px; max-width:980px;}
  .grid-2{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:20px;}
  .grid-4{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px;}
  .grid-4-16{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px;}
  .nav-controls{display:flex; flex-direction:column; gap:24px;}
  .subnav-list{display:flex; flex-direction:column; gap:4px;}
  .mobile-navbar{display:none;}

  @media (max-width: 860px){
    .app-shell{flex-direction:column;}
    .sidebar{width:100%; padding:18px 18px 8px;}
    .sidebar .nav-controls{display:none;} /* the sticky mobile-navbar copy replaces this one */
    .sidebar-footnote{display:none;} /* footer note — reclaim space on mobile */
    .main{max-width:100%; padding:20px 16px 48px;}
    .grid-2{grid-template-columns:1fr;}
    .grid-4, .grid-4-16{grid-template-columns:repeat(2, minmax(0,1fr));}

    .mobile-navbar{
      display:flex; flex-direction:column; gap:10px;
      position:sticky; top:0; z-index:30;
      background:var(--sbg); color:var(--stext);
      padding:12px 16px 12px; border-bottom:1px solid var(--sborder);
    }
    .mobile-navbar .subnav-list{flex-direction:row; overflow-x:auto; -webkit-overflow-scrolling:touch; gap:8px; padding-bottom:2px;}
    .mobile-navbar .subnav-list button{white-space:nowrap; flex-shrink:0; padding:11px 14px !important;}
    .mobile-navbar button{min-height:40px;}

    .roster-row{flex-wrap:wrap; row-gap:8px;}
    .roster-row .roster-status{margin-left:52px;}

    .sec-status-row{flex-wrap:wrap; row-gap:6px;}

    .kiosk-body{padding:24px 16px 48px !important;}
  }

  .kiosk-shell{min-height:100vh; background:var(--bg); display:flex; flex-direction:column;}
  .kiosk-header{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; background:var(--sbg); color:var(--stext);}
  .kiosk-brand{font-family:'Unbounded',sans-serif; font-weight:600; font-size:14px;}
  .kiosk-exit{background:none; border:1px solid var(--sborder); color:var(--smuted); font-size:11.5px; padding:7px 13px; border-radius:8px;}
  .kiosk-body{flex:1; padding:32px 24px 60px; max-width:720px; margin:0 auto; width:100%;}
  .kiosk-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:14px; margin-top:22px;}
  .kiosk-tile{display:flex; flex-direction:column; align-items:center; gap:10px; background:#fff; border:1px solid var(--border); border-radius:16px; padding:22px 12px; min-height:120px; justify-content:center;}
  .kiosk-avatar{width:52px; height:52px; border-radius:50%; background:var(--accent-soft); color:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:16px; flex-shrink:0;}
  .kiosk-name{font-size:13px; font-weight:600; text-align:center; line-height:1.3;}
  .kiosk-thanks{text-align:center; background:#fff; border:1px solid var(--border); border-radius:16px; padding:48px 24px; margin-top:24px;}
</style>
</head>

  { role: 'Coach', detail: 'Clearance + return-to-play stage only — never a diagnosis' },
  { role: 'Athlete', detail: 'Own profile, consent toggles, and transfer' },
  { role: 'Club Admin', detail: 'Roster, staff accounts, and eligibility status — never clinical detail' }
];
const SECURITY_SPECS = ['AES-256 at rest', 'TLS 1.3 in transit', 'Separate key for check-in data', 'Hosted in Rwanda'];
const SECURITY_STATUS_ROWS = [
  { label: 'Role-based access (Clinician / Coach / Athlete / Club Admin)', status: 'Live in prototype', live: true },
  { label: 'Consent controls & transfer flow', status: 'Live in prototype', live: true },
  { label: 'Roster, staff & season administration', status: 'Live in prototype', live: true },
  { label: 'Kiosk-mode PIN lock', status: 'Designed for MVP build', live: false },
  { label: 'Encryption, real login, audit logs', status: 'Designed for MVP build', live: false },
  { label: 'In-country hosting & encrypted backups', status: 'Designed for MVP build', live: false },
  { label: 'NCSA / DPO registration', status: 'Scheduled once a pilot club is confirmed', live: false },
  { label: 'NHIC / e-Ubuzima integration', status: 'Future phase', live: false }
];

function getCoachStatus(clearance, rtpStage) {
  return clearance === 'Restricted'
    ? { bg: 'var(--accent2-soft)', color: 'var(--accent2-dark)', label: 'Not available', detail: 'Restricted by club medical staff — hold out of training and games until reviewed.' }
    : clearance === 'Referred'
    ? { bg: 'var(--danger-soft)', color: 'var(--danger)', label: 'Pending review', detail: 'Referred for specialist follow-up — hold out of contact activity until cleared.' }
    : clearance === 'Cleared' && rtpStage < 5
    ? { bg: 'var(--accent2-soft)', color: 'var(--accent2-dark)', label: `In progression — stage ${rtpStage + 1} of 6`, detail: `Currently at "${RTP_STAGES[rtpStage]}." Follow this stage's activity limits; medical staff will advance the stage when ready.` }
    : clearance === 'Cleared' && rtpStage === 5
    ? { bg: 'var(--success-soft)', color: 'var(--success)', label: 'Full availability', detail: 'Cleared for full training and match play — no activity restrictions on file.' }
    : { bg: 'var(--bg)', color: 'var(--muted)', label: 'Awaiting screening', detail: 'Pre-participation screening not yet completed by medical staff.' };
}

let state = {
  playerType: 'rwandan',
  role: 'clinician',
  clinicianTab: 'cardiac',
  athleteTab: 'care',
  careRequests: {},
  cardiacPersonal: {}, cardiacFamily: {}, cardiacExam: {},
  clearance: null,
  redFlags: {},
  symptomCount: 0, memoryScore: 30, recallScore: 10, balanceErrors: 0,
  rtpStage: 0,
  phq9: Array(9).fill(null),
  psqi: Array(7).fill(null),
  checkinDone: false,
  consent: { 0: true, 1: true, 2: false, 3: false },
  transferClub: null,
  transferSent: false,
  coachSelectedId: null,
  showSecurity: false,
  triageHead: null, triageOther: null, triageOverride: false,
  kioskMode: false, kioskSelectedId: null,
  adminRoster: STATIC_ROSTER.map((p) => ({ ...p, physicianOfRecord: 'Dr. sample, team physician', insurance: 'Active', eligibility: 'Registered' })),
  adminStaff: [
    { id: 's1', name: 'Dr. sample, team physician', roleLabel: 'Team physician — Clinician access' },
    { id: 's2', name: 'Coach sample', roleLabel: 'Head coach — Coach access' }
  ],
  seasonArchived: false
};

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

function toggleSet(key, id) {
  const set = { ...state[key] };
  set[id] = !set[id];
  setState({ [key]: set });
}

function scaleOptions(stateKey, idx, labels) {
  const current = state[stateKey][idx];
  return labels.map((label, val) => ({
    label,
    border: current === val ? 'var(--success)' : 'var(--border)',
    bg: current === val ? 'var(--success)' : '#fff',
    color: current === val ? '#fff' : 'var(--text)',
    pick: () => {
      const arr = [...state[stateKey]];
      arr[idx] = val;
      setState({ [stateKey]: arr });
    }
  }));
}

let H = {}, hid = 0;
function reg(fn) { const id = 'h' + (hid++); H[id] = fn; return id; }

function checkSvg() {
  return '<svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4.5L4 7.5L10 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function checklistHTML(items) {
  return items.map((item) => `
    <button data-h="${reg(item.toggle)}" style="display:flex; align-items:center; gap:10px; text-align:left; background:none; border:none; padding:9px 4px; border-radius:8px; width:100%;">
      <span style="width:18px; height:18px; border-radius:5px; border:1.5px solid ${item.boxBorder}; background:${item.boxBg}; flex-shrink:0; display:flex; align-items:center; justify-content:center;">
        ${item.checked ? checkSvg() : ''}
      </span>
      <span style="font-size:13.5px; line-height:1.35;">${item.label}</span>
    </button>
  `).join('');
}

function computeVals() {
  const s = state;
  const player = PLAYERS[s.playerType];

  const checklistItems = (labels, key, color) => labels.map((label, i) => ({
    label, checked: !!s[key][i],
    boxBorder: s[key][i] ? (color || 'var(--accent)') : 'var(--border)',
    boxBg: s[key][i] ? (color || 'var(--accent)') : '#fff',
    toggle: () => toggleSet(key, i)
  }));

  const clearanceOptions = ['Cleared', 'Referred', 'Restricted'].map((label) => ({
    label,
    border: s.clearance === label ? 'var(--accent)' : 'var(--border)',
    bg: s.clearance === label ? 'var(--accent-soft)' : '#fff',
    color: s.clearance === label ? 'var(--accent-dark)' : 'var(--text)',
    pick: () => setState({ clearance: label })
  }));

  const rtpStages = RTP_STAGES.map((label, i) => ({
    num: i + 1, label,
    border: s.rtpStage === i ? 'var(--accent2-dark)' : 'var(--border)',
    bg: s.rtpStage === i ? 'var(--accent2)' : '#fff',
    color: s.rtpStage === i ? 'var(--accent2-dark)' : 'var(--text)',
    pick: () => setState({ rtpStage: i })
  }));

  const phq9Items = PHQ9_QUESTIONS.map((text, i) => ({ text, options: scaleOptions('phq9', i, PHQ9_LABELS) }));
  const psqiItems = PSQI_COMPONENTS.map((name, i) => ({ name, options: scaleOptions('psqi', i, PSQI_LABELS) }));

  const phq9Answered = s.phq9.filter((v) => v !== null).length;
  const phq9Total = s.phq9.reduce((a, v) => a + (v || 0), 0);
  let phq9Band = '';
  if (phq9Answered === 9) {
    phq9Band = phq9Total <= 4 ? 'minimal' : phq9Total <= 9 ? 'mild' : phq9Total <= 14 ? 'moderate' : phq9Total <= 19 ? 'moderately severe' : 'severe';
  }
  const phq9ScoreLine = phq9Answered < 9 ? `${phq9Answered} of 9 answered` : `Score ${phq9Total}/27 — ${phq9Band}`;

  const psqiAnswered = s.psqi.filter((v) => v !== null).length;
  const psqiTotal = s.psqi.reduce((a, v) => a + (v || 0), 0);
  const psqiScoreLine = psqiAnswered < 7 ? `${psqiAnswered} of 7 answered` : `Global score ${psqiTotal}/21 — ${psqiTotal > 5 ? 'poor sleep quality' : 'good sleep quality'}`;

  const consentItems = CONSENT_LABELS.map((label, i) => ({
    label,
    trackBg: s.consent[i] ? 'var(--success)' : 'var(--border)',
    knobLeft: s.consent[i] ? '20px' : '2px',
    toggle: () => setState({ consent: { ...s.consent, [i]: !s.consent[i] } })
  }));

  const clearanceBadge = getClearanceBadge(s.clearance);

  const activeRosterEntry = {
    id: 'active', name: player.name, initials: player.initials, position: player.position, jersey: player.jersey,
    clearance: s.clearance, rtpStage: s.rtpStage, linked: true
  };
  const fullRoster = [activeRosterEntry, ...STATIC_ROSTER];

  const coachRosterItems = fullRoster.map((p) => {
    const st = getCoachStatus(p.clearance, p.rtpStage);
    return { ...p, statusBg: st.bg, statusColor: st.color, statusLabel: st.label, statusDetail: st.detail, select: () => setState({ coachSelectedId: p.id }) };
  });

  const coachSelectedPlayer = (() => {
    const found = fullRoster.find((p) => p.id === s.coachSelectedId);
    if (!found) return null;
    const st = getCoachStatus(found.clearance, found.rtpStage);
    const cb = getClearanceBadge(found.clearance);
    return {
      ...found,
      statusBg: st.bg, statusColor: st.color, statusLabel: st.label, statusDetail: st.detail,
      cardiacBadgeBg: cb.bg, cardiacBadgeColor: cb.color, cardiacBadgeLabel: cb.label,
      rtpDots: RTP_STAGES.map((label, i) => ({ label, num: i + 1, filled: found.clearance === 'Cleared' && i <= found.rtpStage }))
    };
  })();

  const btnStyle = (active) => `flex-shrink:0; font-size:10.5px; font-weight:600; padding:6px 8px; border-radius:7px; border:1.5px solid ${active ? 'var(--accent2)' : 'var(--sborder)'}; background:${active ? 'var(--accent2-soft)' : 'transparent'}; color:${active ? 'var(--accent2)' : 'var(--smuted)'};`;
  const navBtn = (active, tabColor) => `text-align:left; padding:10px 12px; border:none; border-radius:9px; font-size:13.5px; font-weight:600; background:${active ? tabColor + '26' : 'transparent'}; color:${active ? tabColor : 'var(--stext)'};`;
  const roleBtn = (active) => `background:${active ? 'var(--ssurface)' : 'transparent'}; box-shadow:${active ? '0 1px 3px rgba(0,0,0,0.3)' : 'none'}; color:${active ? 'var(--stext)' : 'var(--smuted)'};`;

  // Triage (two-tier quick screen ahead of the full injury/concussion assessment)
  const triageYN = (key) => {
    const val = s[key];
    const mk = (label, boolVal) => {
      const active = val === boolVal;
      const activeColor = boolVal ? 'var(--danger)' : 'var(--success)';
      const activeBg = boolVal ? 'var(--danger-soft)' : 'var(--success-soft)';
      return {
        label,
        border: active ? activeColor : 'var(--border)',
        bg: active ? activeBg : '#fff',
        color: active ? activeColor : 'var(--text)',
        pick: () => setState({ [key]: boolVal })
      };
    };
    return [mk('Yes', true), mk('No', false)];
  };
  const quickScreenAnswered = s.triageHead !== null && s.triageOther !== null;
  const quickScreenFlagged = s.triageHead === true || s.triageOther === true;
  const showFullAssessment = s.triageOverride || quickScreenFlagged;
  const showScreenedClear = !showFullAssessment && quickScreenAnswered;
  const showQuickScreen = !showFullAssessment && !showScreenedClear;

  // Kiosk mode — shared-tablet check-in with an auto lockback to the roster
  const kioskRosterItems = fullRoster.map((p) => ({
    ...p,
    selectKiosk: () => setState({ kioskSelectedId: p.id, phq9: Array(9).fill(null), psqi: Array(7).fill(null), checkinDone: false })
  }));
  const kioskSelectedPlayer = fullRoster.find((p) => p.id === s.kioskSelectedId) || null;
  const kioskReset = () => setState({ kioskSelectedId: null, phq9: Array(9).fill(null), psqi: Array(7).fill(null), checkinDone: false });

  // Club Admin — roster, staff & eligibility administration; never clinical content
  const activeAdminEntry = {
    id: 'active', name: player.name, position: player.position, jersey: player.jersey,
    physicianOfRecord: 'Dr. sample, team physician', insurance: 'Active', eligibility: 'Registered', isActive: true
  };
  const adminRosterItems = [activeAdminEntry, ...s.adminRoster].map((p) => ({
    ...p,
    remove: p.isActive ? null : () => setState({ adminRoster: s.adminRoster.filter((x) => x.id !== p.id) })
  }));
  const adminStaffItems = s.adminStaff.map((st) => ({
    ...st,
    remove: () => setState({ adminStaff: s.adminStaff.filter((x) => x.id !== st.id) })
  }));

  return {
    isClinician: s.role === 'clinician',
    isCoach: s.role === 'coach',
    isAthlete: s.role === 'athlete',
    isAdmin: s.role === 'admin',
    setClinician: () => setState({ role: 'clinician', showSecurity: false }),
    setCoach: () => setState({ role: 'coach', coachSelectedId: null, showSecurity: false }),
    setAthlete: () => setState({ role: 'athlete', showSecurity: false }),
    setAdmin: () => setState({ role: 'admin', showSecurity: false }),
    clinicianRoleBtnStyle: roleBtn(s.role === 'clinician'),
    coachRoleBtnStyle: roleBtn(s.role === 'coach'),
    athleteRoleBtnStyle: roleBtn(s.role === 'athlete'),
    adminRoleBtnStyle: roleBtn(s.role === 'admin'),
    showAdmin: s.role === 'admin',

    showCoachRoster: s.role === 'coach' && !s.coachSelectedId,
    showCoachDetail: s.role === 'coach' && !!s.coachSelectedId,
    coachRosterItems,
    coachSelectedPlayer,
    backToRoster: () => setState({ coachSelectedId: null }),

    showSecurity: s.showSecurity,
    setSecurity: () => setState({ showSecurity: true }),
    exitSecurity: () => setState({ showSecurity: false }),

    showCardiac: s.role === 'clinician' && s.clinicianTab === 'cardiac',
    showInjury: s.role === 'clinician' && s.clinicianTab === 'injury',
    setTabCardiac: () => setState({ clinicianTab: 'cardiac' }),
    setTabInjury: () => setState({ clinicianTab: 'injury' }),
    cardiacTabStyle: navBtn(s.clinicianTab === 'cardiac', '#7ea0b8'),
    injuryTabStyle: navBtn(s.clinicianTab === 'injury', '#f2cf4a'),

    showCare: s.role === 'athlete' && s.athleteTab === 'care',
    showProfile: s.role === 'athlete' && s.athleteTab === 'profile',
    showCheckin: s.role === 'athlete' && s.athleteTab === 'checkin',
    setTabCare: () => setState({ athleteTab: 'care' }),
    setTabProfile: () => setState({ athleteTab: 'profile' }),
    setTabCheckin: () => setState({ athleteTab: 'checkin' }),
    careTabStyle: navBtn(s.athleteTab === 'care', '#3a9376'),
    profileTabStyle: navBtn(s.athleteTab === 'profile', '#3a9376'),
    checkinTabStyle: navBtn(s.athleteTab === 'checkin', '#3a9376'),

    playerName: player.name, playerTeam: player.team, initials: player.initials,
    position: player.position, jersey: player.jersey, dob: player.dob, nationality: player.nationality,
    idLabel: player.idLabel, idValue: player.idValue, idNote: player.idNote,
    setRwandan: () => setState({ playerType: 'rwandan' }),
    setForeign: () => setState({ playerType: 'foreign' }),
    rwandanBtnStyle: btnStyle(s.playerType === 'rwandan'),
    foreignBtnStyle: btnStyle(s.playerType === 'foreign'),

    personalHistoryItems: checklistItems(PERSONAL_HISTORY, 'cardiacPersonal'),
    familyHistoryItems: checklistItems(FAMILY_HISTORY, 'cardiacFamily'),
    examItems: checklistItems(EXAM_ITEMS, 'cardiacExam'),
    clearanceOptions,
    clinicianName: 'Dr. sample, team physician', screeningDate: '7 Sept 2026',

    injuryHistory: [
      { title: 'Grade 1 right ankle sprain', date: '14 Mar 2026', club: 'RSSB Tigers', status: 'Cleared', badgeBg: 'var(--success-soft)', badgeColor: 'var(--success)' },
      { title: 'Concussion — sideline assessment', date: '2 Aug 2026', club: 'RSSB Tigers', status: 'RTP in progress', badgeBg: 'var(--accent2-soft)', badgeColor: 'var(--accent2-dark)' }
    ],
    redFlagItems: checklistItems(RED_FLAGS, 'redFlags', 'var(--accent2-dark)'),
    symptomCount: s.symptomCount,
    symptomInc: () => setState({ symptomCount: Math.min(22, s.symptomCount + 1) }),
    symptomDec: () => setState({ symptomCount: Math.max(0, s.symptomCount - 1) }),
    memoryScore: s.memoryScore,
    memoryInc: () => setState({ memoryScore: Math.min(30, s.memoryScore + 1) }),
    memoryDec: () => setState({ memoryScore: Math.max(0, s.memoryScore - 1) }),
    recallScore: s.recallScore,
    recallInc: () => setState({ recallScore: Math.min(10, s.recallScore + 1) }),
    recallDec: () => setState({ recallScore: Math.max(0, s.recallScore - 1) }),
    balanceErrors: s.balanceErrors,
    balanceInc: () => setState({ balanceErrors: Math.min(30, s.balanceErrors + 1) }),
    balanceDec: () => setState({ balanceErrors: Math.max(0, s.balanceErrors - 1) }),
    rtpStages,

    triageHeadOptions: triageYN('triageHead'),
    triageOtherOptions: triageYN('triageOther'),
    showQuickScreen, showScreenedClear, showFullAssessment,
    openFullAssessmentAnyway: () => setState({ triageOverride: true }),
    resetTriage: () => setState({ triageHead: null, triageOther: null, triageOverride: false }),

    cardiacBadgeBg: clearanceBadge.bg, cardiacBadgeColor: clearanceBadge.color, cardiacBadgeLabel: clearanceBadge.label,
    athleteRtpLabel: `${s.rtpStage + 1}. ${RTP_STAGES[s.rtpStage]}`,

    phq9Items, phq9ScoreLine,
    psqiItems, psqiScoreLine,
    submitCheckin: () => setState({ checkinDone: true }),
    checkinDone: s.checkinDone,
    consentItems,

    transferClubs: TRANSFER_CLUBS.map((label) => ({
      label,
      border: s.transferClub === label ? 'var(--accent2-dark)' : 'var(--border)',
      bg: s.transferClub === label ? 'var(--accent2-soft)' : '#fff',
      color: s.transferClub === label ? 'var(--accent2-dark)' : 'var(--text)',
      pick: () => setState({ transferClub: label, transferSent: false })
    })),
    sendTransfer: () => setState({ transferSent: true, consent: { ...s.consent, 3: true } }),
    transferSent: s.transferSent,
    transferClub: s.transferClub,

    careItems: CARE_FACILITIES.map((f) => {
      const requested = !!s.careRequests[f.id];
      return {
        ...f,
        reqLabel: requested ? '✓ Requested' : 'Request an introduction',
        reqBorder: requested ? 'var(--success)' : 'var(--border)',
        reqBg: requested ? 'var(--success-soft)' : '#fff',
        reqColor: requested ? 'var(--success)' : 'var(--text)',
        request: () => setState({ careRequests: { ...s.careRequests, [f.id]: true } })
      };
    }),

    kioskMode: s.kioskMode,
    enterKiosk: () => setState({ kioskMode: true, kioskSelectedId: null, phq9: Array(9).fill(null), psqi: Array(7).fill(null), checkinDone: false }),
    exitKiosk: () => setState({ kioskMode: false, kioskSelectedId: null, phq9: Array(9).fill(null), psqi: Array(7).fill(null), checkinDone: false }),
    kioskRosterItems,
    kioskSelectedId: s.kioskSelectedId,
    kioskSelectedPlayer,
    kioskReset,
    kioskSubmit: () => { setState({ checkinDone: true }); setTimeout(kioskReset, 4000); },

    adminRosterItems,
    adminAddPlayer: () => setState({ adminRoster: [...s.adminRoster, { id: 'new' + Date.now(), name: `New player ${s.adminRoster.length + 1}`, position: 'Unassigned', jersey: '#--', physicianOfRecord: 'Unassigned', insurance: 'Pending', eligibility: 'Pending registration' }] }),
    adminStaffItems,
    adminAddStaff: () => setState({ adminStaff: [...s.adminStaff, { id: 'staff' + Date.now(), name: `New staff account ${s.adminStaff.length + 1}`, roleLabel: 'Unassigned role' }] }),
    seasonArchived: s.seasonArchived,
    seasonLabel: s.seasonArchived ? 'Start new season' : 'Archive & roll over season',
    seasonStatusText: s.seasonArchived ? 'Season archived — roster carried forward. Ready to set up the next season.' : 'Current season active.',
    adminToggleSeason: () => setState({ seasonArchived: !s.seasonArchived })
  };
}

    <div class="nav-controls">
      <div>
        <div class="mono-label" style="font-size:10px; color:var(--smuted); margin-bottom:8px;">Viewing as</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; background:var(--sbg); border:1px solid var(--sborder); border-radius:10px; padding:3px; gap:3px;">

          <button data-h="${reg(v.setCoach)}" style="${v.coachRoleBtnStyle} padding:8px 0; border:none; border-radius:8px; font-size:12.5px; font-weight:600;">Coach</button>
          <button data-h="${reg(v.setAthlete)}" style="${v.athleteRoleBtnStyle} padding:8px 0; border:none; border-radius:8px; font-size:12.5px; font-weight:600;">Athlete</button>
          <button data-h="${reg(v.setAdmin)}" style="${v.adminRoleBtnStyle} padding:8px 0; border:none; border-radius:8px; font-size:12.5px; font-weight:600;">Club Admin</button>

      </div>

      <button data-h="${reg(v.setSecurity)}" style="text-align:left; padding:10px 12px; border:1px solid var(--sborder); border-radius:9px; font-size:12.5px; font-weight:600; background:${v.showSecurity ? 'var(--ssurface)' : 'transparent'}; color:var(--stext);">Data &amp; security</button>

      <button data-h="${reg(v.enterKiosk)}" style="text-align:left; padding:10px 12px; border:1px solid var(--sborder); border-radius:9px; font-size:12.5px; font-weight:600; background:transparent; color:var(--stext);">Kiosk mode</button>

      ${v.isAdmin ? `
      <div style="font-size:11.5px; color:var(--smuted); line-height:1.45; background:var(--ssurface); border:1px solid var(--sborder); border-radius:10px; padding:10px 12px;">

      ${v.isAthlete ? `
      <div class="subnav-list">
        <button data-h="${reg(v.setTabCare)}" style="${v.careTabStyle}">Care network</button>
        <button data-h="${reg(v.setTabProfile)}" style="${v.profileTabStyle}">My profile</button>
        <button data-h="${reg(v.setTabCheckin)}" style="${v.checkinTabStyle}">Recovery check-in</button>
      </div>` : ''}
    </div>
  `;
}

function sidebarHTML(v) {
  return `
    <div class="sidebar">
      <div style="display:flex; align-items:center; gap:10px;">
        <svg width="34" height="30" viewBox="0 0 64 56" fill="none" style="flex-shrink:0;">
          <rect x="6" y="10" width="52" height="38" rx="8" stroke="var(--accent2)" stroke-width="3"/>
          <path d="M10,30 L20,30 L24,18 L30,42 L34,22 L40,30 L54,30" stroke="var(--accent2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M22,44 Q32,50 42,44" stroke="var(--saccent)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        </svg>
        <div style="display:flex; flex-direction:column; gap:2px;">
          <div style="font-family:'Unbounded',sans-serif; font-weight:700; font-size:17px; letter-spacing:-0.01em; line-height:1.15; color:var(--stext);">UbuzimaCard<br/><span style="font-weight:500; font-size:13px; color:var(--smuted);">Athlete</span></div>
        </div>

          <div style="flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:6px;">

    <p style="color:var(--muted); font-size:12.5px; margin-top:20px; line-height:1.5;">Sample partner facilities shown for demonstration — each club curates and approves its own list. Facilities interested in joining a club's care network go through a separate verification process.</p>
  `;
}

      <div class="kiosk-body">
        ${v.kioskSelectedId ? kioskCheckinHTML(v) : kioskRosterHTML(v)}

  return `

        <button data-h="${reg(v.kioskReset)}" style="margin-top:18px; background:var(--success); color:#fff; border:none; padding:10px 20px; border-radius:10px; font-size:13px; font-weight:600;">Next player &rarr;</button>
      </div>
    `;
  }
  return `
    <button data-h="${reg(v.kioskReset)}" style="display:flex; align-items:center; gap:6px; background:none; border:none; padding:0; margin-bottom:14px; color:var(--accent-dark); font-size:13px; font-weight:600;">&larr; Not you? Back to roster</button>

    <h1 style="font-size:22px; margin:0;">${v.kioskSelectedPlayer ? v.kioskSelectedPlayer.name : 'Recovery check-in'}</h1>
    <p style="color:var(--muted); font-size:13.5px; margin-top:8px;">Two short sets of questions &middot; about 2 minutes</p>

    <div style="background:#fff; border:1px solid var(--border); border-top:3px solid var(--success); border-radius:16px; padding:22px; margin-top:18px;">
      <div style="font-size:13px; font-weight:600;">Over the last two weeks</div>
      <div style="display:flex; flex-direction:column; gap:14px; margin-top:10px;">
        ${v.phq9Items.map((q) => `
          <div style="padding-bottom:14px; border-bottom:1px solid var(--border);">
            <div style="font-size:13.5px; margin-bottom:8px; line-height:1.4;">${q.text}</div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              ${q.options.map((opt) => `<button data-h="${reg(opt.pick)}" style="padding:7px 11px; border-radius:8px; font-size:12px; font-weight:500; border:1.5px solid ${opt.border}; background:${opt.bg}; color:${opt.color};">${opt.label}</button>`).join('')}
            </div>
          </div>
        `).join('')}
      </div>
      <div style="font-size:13px; color:var(--muted); margin-top:6px;">${v.phq9ScoreLine}</div>

      <div style="margin-top:26px; font-size:13px; font-weight:600;">Sleep quality (PSQI components)</div>
      <div style="display:flex; flex-direction:column; gap:14px; margin-top:10px;">
        ${v.psqiItems.map((comp) => `
          <div style="padding-bottom:14px; border-bottom:1px solid var(--border);">
            <div style="font-size:13.5px; margin-bottom:8px;">${comp.name}</div>

            </div>

      <div style="font-size:13px; color:var(--muted); margin-top:6px;">${v.psqiScoreLine}</div>

      <div style="margin-top:22px;">

  return `

    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:26px; margin-bottom:10px;">

      <button data-h="${reg(v.adminAddPlayer)}" style="background:none; border:1.5px solid var(--border); padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600; color:var(--text);">+ Add player</button>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      ${v.adminRosterItems.map((p) => `

          <div style="min-width:160px;">
            <div style="font-size:13.5px; font-weight:600;">${p.name}${p.isActive ? ' <span style="font-weight:500; color:var(--muted); font-size:11.5px;">(you)</span>' : ''}</div>
            <div style="font-size:12px; color:var(--muted); margin-top:2px;">${p.position || ''} &middot; ${p.jersey || ''}</div>
          </div>

          <span style="font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:20px; background:var(--success-soft); color:var(--success); white-space:nowrap;">${p.insurance}</span>
          <span style="font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:20px; background:var(--accent-soft); color:var(--accent-dark); white-space:nowrap;">${p.eligibility}</span>

      <button data-h="${reg(v.adminAddStaff)}" style="background:none; border:1.5px solid var(--border); padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600; color:var(--text);">+ Add staff</button>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      ${v.adminStaffItems.map((st) => `
        <div style="background:#fff; border:1px solid var(--border); border-radius:12px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px;">
          <div>
            <div style="font-size:13.5px; font-weight:600;">${st.name}</div>
            <div style="font-size:12px; color:var(--muted); margin-top:2px;">${st.roleLabel}</div>
          </div>
          <button data-h="${reg(st.remove)}" style="background:none; border:none; color:var(--danger); font-size:12px; font-weight:600;">Remove</button>
        </div>
      `).join('')}
    </div>

    <h3 class="mono-label" style="font-family:'IBM Plex Mono',monospace; font-weight:400; font-size:11px; color:var(--muted); margin-top:28px; margin-bottom:10px;">Season</h3>

      <p style="font-size:13px; color:var(--text); margin:0; max-width:420px; line-height:1.5;">${v.seasonStatusText}</p>
      <button data-h="${reg(v.adminToggleSeason)}" style="background:var(--accent2-dark); color:#fff; border:none; padding:10px 18px; border-radius:9px; font-size:12.5px; font-weight:600; white-space:nowrap;">${v.seasonLabel}</button>
    </div>

    <p style="color:var(--muted); font-size:12.5px; margin-top:20px; line-height:1.5;">Bulk roster import (CSV) and full season-history archiving are designed for the MVP build, not this clickable prototype.</p>
  `;
}

function render() {
  H = {}; hid = 0;
  const v = computeVals();

  if (v.kioskMode) {
    document.getElementById('app').innerHTML = kioskAppHTML(v);
    return;
  }

  document.getElementById('app').innerHTML = `
    <div class="mobile-navbar">${navControlsHTML(v)}</div>
    <div class="app-shell">
      ${sidebarHTML(v)}
      <div class="main">
        ${v.showSecurity ? securityHTML(v) : `
        ${v.showCardiac ? cardiacHTML(v) : ''}
        ${v.showInjury ? injuryHTML(v) : ''}
        ${v.showCoachRoster ? coachRosterHTML(v) : ''}
        ${v.showCoachDetail ? coachDetailHTML(v) : ''}
        ${v.showCare ? careHTML(v) : ''}
        ${v.showProfile ? profileHTML(v) : ''}
        ${v.showCheckin ? checkinHTML(v) : ''}
        ${v.showAdmin ? adminHTML(v) : ''}
        `}
      </div>
    </div>
  `;
}

document.getElementById('app').addEventListener('click', function (e) {
  const el = e.target.closest('[data-h]');
  if (el && H[el.dataset.h]) H[el.dataset.h]();
});

render();
</script>

</html>
